name: CI

on:
  push:
    branches: ["**"] # All branches
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      # Cache pnpm store — dramatically speeds up subsequent runs
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate Prisma client so TypeScript can resolve @prisma/client types
      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          # Prisma generate doesn't need a real DB — dummy URL is fine
          DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"

      # tsc --noEmit checks types without writing output files
      # This catches all type errors that would fail at build time
      - name: TypeScript type check
        run: npx tsc --noEmit

      # Full build to confirm compiled output is valid
      - name: Build
        run: pnpm build
